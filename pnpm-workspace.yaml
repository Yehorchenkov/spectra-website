    payload: "*"
    "@payloadcms/ui": "*"
    i18next: "*"
    date-fns-tz: "*"
    slug: "*"

overrides:
  esbuild: "^0.28.1"
  cookie: "^1.1.0"
  minimatch: "^10.2.4"
  ajv: "^8.18.0"
  rollup: "^4.59.0"
  immutable: "^4.3.9"
  dompurify: "^3.4.14"
  undici: "^7.24.5"
  file-type: "^21.3.4"
  happy-dom: "^20.8.9"
  lodash: "^4.18.1"
  drizzle-orm: "^0.45.2"
  uuid: "^14.0.0"
  fast-uri: "^3.1.6"
  ws: "^8.21.1"
  brace-expansion: "^5.0.9"
  js-yaml: "^5.2.2"
  sharp: "^0.35.3"
  qs: "^6.15.3"
  postcss: "^8.5.25"
  nanoid: "^3.3.18"
  "@babel/core": "^8.0.1"
  vitest>vite: "7.3.6"

minimumReleaseAgeExclude:
