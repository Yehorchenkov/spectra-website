  minimatch: "^10.2.4"
  ajv: "^8.18.0"
  rollup: "^4.59.0"
  immutable: "^4.3.9"
  dompurify: "^3.4.17"
  undici: "^7.30.1"
  browserslist: "^4.29.4"
  source-map-js: "^1.2.2"
  file-type: "^21.3.4"
  fflate: "^0.8.3"
  happy-dom: "^20.8.9"
  lodash: "^4.18.1"
  drizzle-orm: "^0.45.2"
  uuid: "^14.0.0"
  fast-uri: "^4.2.3"
  ws: "^8.21.1"
  brace-expansion: "^5.0.12"
  "@humanfs/node": "^0.17.0"
  baseline-browser-mapping: "^2.11.30"
  js-yaml: "^5.5.0"
  sharp: "^0.35.5"
  postcss: "^8.5.25"
